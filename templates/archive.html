<div class="container archive-page">
  <header class="page-heading" data-od-id="archive-heading">
    <p class="eyebrow">$eyebrow</p>
    <h1>$heading<span class="accent-dot">.</span></h1>
    <p>$lede</p>
  </header>
  <nav class="topic-tabs" aria-label="Browse topics">
    <a href="$archive_root">Everything</a>$topics
  </nav>
  <div class="archive-toolbar">
    <p><span data-result-count>$count</span> $count_noun</p>
    <label class="search-box" data-search-control hidden
      ><span>$search_label</span
      ><input
        type="search"
        data-search
        placeholder="$search_placeholder"
        autocomplete="off"
        aria-controls="article-list"
    /></label>
  </div>
  <div id="article-list" class="archive-list">$cards</div>
  <section class="empty-state" data-empty hidden>
    <h2>$empty_title</h2>
    <p>$empty_text</p>
    <button type="button" data-clear-search class="button">Clear search</button>
  </section>
  <p class="sr-only" role="status" data-search-status></p>
</div>
