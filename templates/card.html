<article class="story$extra" data-search-item>
  <div class="story-meta">
    <a class="topic-label" href="/topics/$topic/">$topic_name</a
    ><span>$kind</span>
  </div>
  <h3><a href="$url">$title</a></h3>
  <p>$description</p>
  <div class="story-foot">
    <span
      ><time datetime="$date">$date_label</time>
      <span aria-hidden="true">·</span> $reading min read</span
    ><a class="story-arrow" href="$url" aria-label="Read $title">↗</a>
  </div>
</article>
