<article class="featured">
  <div class="feature-copy">
    <p class="eyebrow">
      The featured read
      <span class="tiny-rule" aria-hidden="true"></span> $topic_name
    </p>
    <h2><a href="$url">$title</a></h2>
    <p class="feature-description">$description</p>
    <div class="byline">
      <span class="avatar" aria-hidden="true">m</span>
      <div>
        <span>Machine Made Worlds</span
        ><span class="meta"
          ><time datetime="$date">$date_label</time> · $reading min read</span
        >
      </div>
    </div>
    <a class="text-link" href="$url"
      >Read the $kind <span aria-hidden="true">↗</span></a
    >
  </div>
  <div class="feature-art" aria-hidden="true">
    <div class="art-top">
      <span>$topic_name</span><span>THE FEATURED READ</span>
    </div>
    <div class="orbital">
      <div class="orbit orbit-a"></div>
      <div class="orbit orbit-b"></div>
      <div class="orbit orbit-c"></div>
      <span class="core">ideas<br /><i>take shape.</i></span
      ><span class="orbit-dot"></span>
    </div>
    <div class="art-bottom">
      <span>MODELS × MACHINES</span><span class="art-monogram">mw.</span>
    </div>
  </div>
</article>
