<article class="container article-page">
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="/blog/">The journal</a><span aria-hidden="true">/</span
    ><a href="/topics/$topic/">$topic_name</a>
  </nav>
  <header class="article-heading" data-od-id="article-heading">
    <p class="eyebrow">
      $kind <span class="tiny-rule" aria-hidden="true"></span> $topic_name
    </p>
    <h1>$title</h1>
    <p class="article-lead">$lead</p>
    <div class="byline">
      <span class="avatar" aria-hidden="true">m</span>
      <div>
        <span>Machine Made Worlds</span
        ><span class="meta"
          ><time datetime="$date">$date_label</time> · $reading min read</span
        >
      </div>
    </div>
  </header>
  <div class="reading-layout">
    <aside class="reading-sidebar" $toc_hidden>
      <nav class="toc" aria-label="In this article">
        <p class="eyebrow">In this article</p>
        $toc
      </nav>
      <a class="text-link" href="/feed.xml">Follow the journal ↗</a>
    </aside>
    <div class="article-body" data-od-id="article-body">
      $body
      <div class="article-end">
        <span aria-hidden="true">m·w</span
        ><a href="/blog/">← Back to the journal</a>
      </div>
    </div>
  </div>
  <section class="related" aria-labelledby="related-heading">
    <div class="section-heading">
      <h2 id="related-heading">Keep exploring.</h2>
      <a class="text-link" href="/blog/">All articles ↗</a>
    </div>
    <div class="related-grid">$related</div>
  </section>
</article>
